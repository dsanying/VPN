name: Release

on:
  push:
    tags:
      - 'v*'
  # Build and install the same candidate artifacts before creating an immutable tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: android

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      # 提权 helper 二进制不入库（.gitignore），由 build:helper 现编现打：mac(helper/) + win(helper-win/)。
      # 必须在 mac 与 win 两个 runner 都装 Go，否则该平台 package 缺 helper 二进制 → 安装提权助手「二进制缺失」(issue #57)。
      - name: Setup Go (提权 helper, mac + win)
        if: matrix.platform == 'mac' || matrix.platform == 'win' || matrix.platform == 'android'
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: helper/go.mod
          cache: false

      - name: Setup Android JDK
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install pinned Android native toolchain
        if: matrix.platform == 'android'
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"

      # openconnect/json-c 开发库用于编译 OpenConnect C 认证适配器（arm64 本机构建；
      # x64 运行时纯 Go 交叉编译、不含 C 适配器）。缺库即失败，不发缺引擎的包。
      - name: Install OpenConnect development libraries (mac)
        if: matrix.platform == 'mac'
        run: brew install openconnect json-c

      - name: Install dependencies
        run: npm ci

      - name: Setup frontend package manager
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - name: Install frontend dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Validate declared platform scope
        run: node --test scripts/release-pipeline.test.mjs scripts/development-validation.test.mjs && npm run check:platforms

      - name: Validate release version
        run: node scripts/check-release-version.mjs ${{ github.event_name == 'workflow_dispatch' && '--candidate' || '' }}

      # Native runtime tests require the same pinned binaries as packaging, even on the Android builder.
      - name: Prepare official core test fixtures
        run: npm run fetch:core

      - name: Validate application
        run: |
          npm test -- --runInBand &&
          npm run lint &&
          npm run typecheck:renderer &&
          npm run build

      - name: Prepare private Android signing key
        if: matrix.platform == 'android'
        run: node scripts/prepare-android-signing.mjs
        env:
          SHADOW_ANDROID_KEYSTORE_BASE64: ${{ secrets.SHADOW_ANDROID_KEYSTORE_BASE64 }}

      - name: Package application
        run: npm run package:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          REQUIRE_HELPER: '1'
          SHADOW_ANDROID_KEY_ALIAS: ${{ secrets.SHADOW_ANDROID_KEY_ALIAS }}
          SHADOW_ANDROID_STORE_PASSWORD: ${{ secrets.SHADOW_ANDROID_STORE_PASSWORD }}
          SHADOW_ANDROID_KEY_PASSWORD: ${{ secrets.SHADOW_ANDROID_KEY_PASSWORD }}

      - name: Build signed release instrumentation APK (android)
        if: matrix.platform == 'android'
        run: node scripts/android-gradle.mjs :app:assembleReleaseAndroidTest -PshadowTestBuildType=release
        env:
          SHADOW_ANDROID_KEY_ALIAS: ${{ secrets.SHADOW_ANDROID_KEY_ALIAS }}
          SHADOW_ANDROID_STORE_PASSWORD: ${{ secrets.SHADOW_ANDROID_STORE_PASSWORD }}
          SHADOW_ANDROID_KEY_PASSWORD: ${{ secrets.SHADOW_ANDROID_KEY_PASSWORD }}

      - name: Remove temporary Android signing key
        if: always() && matrix.platform == 'android'
        run: node scripts/prepare-android-signing.mjs --cleanup

      - name: Verify custom Windows installation and native business operations
        if: matrix.platform == 'win'
        run: ./scripts/verify-windows-install.ps1

      - name: Create DMG (macOS, arm64 + x64)
        if: matrix.platform == 'mac'
        run: |
          # electron-builder.json mac.target.arch = [arm64, x64] → 两个架构的 .app 都已构建，但
          # 多架构下 electron-builder 会把其中一个架构放进【无后缀】的 dist-package/mac/
          # （v4.1.0 实测：x64 落 dist-package/mac、arm64 落 dist-package/mac-arm64），各自含对应架构的提权 helper。
          # 故此处按 arch 后缀目录优先、回退无后缀目录，并用 lipo 校验确属目标架构；缺则【报错失败】（不再静默跳过，
          # 避免 v4.1.0 那样绿灯却漏发 mac-x64 包）。
          VERSION=$(node -p 'require("./package.json").version')
          for ARCH in arm64 x64; do
            DMG_PATH="dist-package/暗影VPN-${VERSION}-mac-${ARCH}.dmg"
            case "$ARCH" in arm64) WANT=arm64 ;; x64) WANT=x86_64 ;; esac
            APP_PATH=""
            for CAND in "dist-package/mac-${ARCH}/暗影VPN.app" "dist-package/mac/暗影VPN.app"; do
              [ -d "$CAND" ] || continue
              EXE=$(ls "$CAND"/Contents/MacOS/* 2>/dev/null | head -1)
              if [ -n "$EXE" ] && lipo -archs "$EXE" 2>/dev/null | tr ' ' '\n' | grep -qx "$WANT"; then
                APP_PATH="$CAND"; break
              fi
            done
            if [ -z "$APP_PATH" ]; then
              echo "::error::找不到 ${ARCH}(${WANT}) 架构的 暗影VPN.app（查了 dist-package/mac-${ARCH}/ 与 dist-package/mac/）——发布将缺 mac-${ARCH} 包，请检查 package:mac 的 electron-builder --${ARCH} 产出。"
              exit 1
            fi
            echo "Using ${ARCH} app bundle: $APP_PATH"
            echo "Ad-hoc deep signing ${ARCH} app bundle (fix Team ID mismatch)..."
            codesign --force --deep --sign - "$APP_PATH"

            echo "Creating ${ARCH} DMG..."
            TEMP_DIR=$(mktemp -d)
            trap 'rm -rf "$TEMP_DIR"' EXIT
            cp -R "$APP_PATH" "$TEMP_DIR/"
            ln -s /Applications "$TEMP_DIR/Applications"
            # 此构建无 Developer ID/公证；发布说明必须如实注明，不能引导关闭系统保护。
            node scripts/create-dmg.mjs -volname "暗影VPN ${VERSION} (${ARCH})" \
              -srcfolder "$TEMP_DIR" \
              -ov -format UDZO \
              "$DMG_PATH"
            rm -rf "$TEMP_DIR"
            trap - EXIT
            echo "Created: $DMG_PATH"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist-package/*.exe
            dist-package/*.dmg
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/output-metadata.json
            android/app/build/outputs/apk/androidTest/release/*.apk
            android/app/libs/sing-box-android-source-*.tar.gz
            android/app/libs/libbox-build.json
            artifacts/client-platform-evidence.json
            artifacts/mac-arm64/**
            artifacts/mac-x64/**
            artifacts/windows-x64/**
            artifacts/android-arm64/**
          retention-days: 5

  native-mac:
    needs: release
    if: always() && !cancelled()
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-mac
          path: downloaded
      - name: Setup native UI test dependencies
        uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - name: Install native UI test dependencies
        run: pnpm --dir web install --frozen-lockfile
      - name: Install exact architecture DMG and test its native business APIs
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          DMG=$(find downloaded -name "暗影VPN-${VERSION}-mac-${TARGET_ARCH}.dmg")
          test -f "$DMG"
          MOUNT="$RUNNER_TEMP/shadow-dmg"
          INSTALLED="$RUNNER_TEMP/shadow-installed"
          mkdir -p "$MOUNT" "$INSTALLED"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" || true' EXIT
          ditto "$MOUNT/暗影VPN.app" "$INSTALLED/暗影VPN.app"
          node scripts/verify-desktop-installed.mjs --layout --exe "$INSTALLED/暗影VPN.app/Contents/MacOS/暗影VPN"
      - name: Upload actual native acceptance results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-mac-${{ matrix.arch }}
          # collect-client-evidence 要求 artifact 顶层保留 artifacts/ 目录结构；
          # 加 package.json 使公共祖先回到仓库根，前缀得以保留。
          path: |
            artifacts/**
            package.json
          if-no-files-found: error
          retention-days: 5

  # Apple Silicon runner 上以 arm64 原生虚拟化跑一次性模拟器，验收已签名的最终 APK。
  native-android:
    needs: release
    if: always() && !cancelled()
    permissions:
      contents: read
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download signed release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-android
          path: downloaded
      - name: Restore APK layout expected by the verifier
        run: |
          mkdir -p android/app/build/outputs/apk
          cp -R "downloaded/android/app/build/outputs/apk/." android/app/build/outputs/apk/
          test -f android/app/build/outputs/apk/release/app-release.apk
          test -f android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
      - name: Install emulator image and tools
        run: |
          sdkmanager "platform-tools" "emulator" "build-tools;35.0.0" "system-images;android-35;google_apis;arm64-v8a"
      - name: Create and boot disposable emulator
        timeout-minutes: 15
        run: |
          echo "no" | avdmanager create avd --name release-check --package "system-images;android-35;google_apis;arm64-v8a" --device pixel_6 --force
          "$ANDROID_HOME/emulator/emulator" -avd release-check -no-window -no-audio -no-snapshot -no-boot-anim &
          adb wait-for-device
          adb shell 'while [ "$(getprop sys.boot_completed | tr -d "\r")" != "1" ]; do sleep 3; done'
      - name: Verify signed release on disposable emulator
        env:
          ANDROID_SERIAL: emulator-5554
        run: node scripts/verify-android-release.mjs --reset-fixture
      - name: Upload actual native acceptance results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-android
          path: |
            artifacts/**
            package.json
          if-no-files-found: error
          retention-days: 5

  create-release:
    needs: [release, native-mac, native-android]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup release validation runtime
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '26'

      - name: Verify native release evidence
        run: |
          node scripts/check-release-version.mjs
          node scripts/collect-client-evidence.mjs artifacts
          node scripts/check-client-platforms.mjs --release --evidence artifacts/client-platform-evidence.json

      - name: Create GitHub Release
        # Release notes 单一来源：generate_release_notes 由 GitHub 自动从 PR 列表生成「## What's Changed」+
        # Full Changelog。不再额外注入 body（曾与 generate_release_notes 叠加导致两个 ## What's Changed 且
        # 与 PR 标题重复）；无需维护 CHANGELOG.md。
        uses: softprops/action-gh-release@v3.0.3
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.apk
            artifacts/**/sing-box-android-source-*.tar.gz
            artifacts/**/libbox-build.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
